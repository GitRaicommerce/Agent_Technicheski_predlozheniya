name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-check:
    name: Docs sync check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify shared agent guide
        run: python scripts/check_agent_guides.py

      - name: Regenerate docs
        run: python scripts/generate_docs.py

      - name: Verify generated docs are committed
        run: git diff --exit-code -- docs/ENGINEERING_OVERVIEW.md

  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://tpai:tpai_test@localhost:5432/tpai_test
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: sk-test-placeholder
          ANTHROPIC_API_KEY: sk-ant-test-placeholder
          MINIO_ENDPOINT: localhost:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          APP_SECRET_KEY: test-secret-key
          EMBEDDING_MODEL: text-embedding-3-small
          EMBEDDING_DIMS: "1536"
        run: python -m pytest tests/ -v --tb=short

  integration:
    # K-18/K-19: real PostgreSQL + pgvector. Migrations on an empty database
    # and from an old schema with data, health readiness, and one
    # deterministic v2 API journey to DOCX. Model/embedding calls are mocked;
    # MinIO ingestion and the browser are not part of this job.
    name: Integration (PostgreSQL, migrations, v2 journey)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tpai
          POSTGRES_PASSWORD: tpai_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        env:
          INTEGRATION_PG_ADMIN_URL: postgresql://tpai:tpai_test@localhost:5432/postgres
          OPENAI_API_KEY: sk-test-placeholder
          APP_SECRET_KEY: test-secret-key
        run: python -m pytest tests_integration -v --tb=short

  script-tests:
    name: Calibration script tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Run script tests
        run: python -m pytest scripts/tests -v --tb=short

  lint-frontend:
    name: TypeScript + ESLint + unit tests (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:run
